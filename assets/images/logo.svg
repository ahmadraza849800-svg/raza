<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE79A" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#095D40" />
      <stop offset="50%" stop-color="#043927" />
      <stop offset="100%" stop-color="#022116" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Circle -->
  <circle cx="250" cy="250" r="235" fill="url(#emeraldGrad)" stroke="url(#goldGrad)" stroke-width="7" />
  <circle cx="250" cy="250" r="222" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="6,4" />

  <!-- 8-Pointed Star (Rub el Hizb) Background Geometry -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.45">
    <rect x="90" y="90" width="320" height="320" rx="10" transform="rotate(0 250 250)" />
    <rect x="90" y="90" width="320" height="320" rx="10" transform="rotate(45 250 250)" />
  </g>

  <!-- Inner Medallion Border -->
  <circle cx="250" cy="250" r="175" fill="#032619" stroke="url(#goldGrad)" stroke-width="4" />

  <!-- Dome & Minaret Silhouette -->
  <path d="M 190 260 C 190 200, 250 170, 250 135 C 250 170, 310 200, 310 260 Z" fill="url(#goldGrad)" opacity="0.9" />
  <!-- Crescent & Finial -->
  <path d="M 250 115 A 14 14 0 1 0 255 138 A 12 12 0 1 1 250 115 Z" fill="url(#goldGrad)" />
  <circle cx="250" cy="112" r="3" fill="url(#goldGrad)" />

  <!-- Open Quran Book Silhouette -->
  <g transform="translate(170, 255) scale(0.8)">
    <path d="M 100 45 C 70 20, 30 25, 5 45 C 5 70, 5 110, 5 110 C 35 90, 75 90, 100 115 C 125 90, 165 90, 195 110 C 195 110, 195 70, 195 45 C 170 25, 130 20, 100 45 Z" fill="#FCFBF7" stroke="url(#goldGrad)" stroke-width="3" />
    <!-- Book Spine & Pages Lines -->
    <path d="M 100 45 L 100 115" stroke="#996515" stroke-width="3" />
    <path d="M 25 55 Q 60 40 90 55 M 25 70 Q 60 55 90 70 M 25 85 Q 60 70 90 85" stroke="#043927" stroke-width="2" opacity="0.5" />
    <path d="M 110 55 Q 140 40 175 55 M 110 70 Q 140 55 175 70 M 110 85 Q 140 70 175 85" stroke="#043927" stroke-width="2" opacity="0.5" />
    <!-- Book Rehal / Stand -->
    <path d="M 60 110 L 140 150 M 140 110 L 60 150" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Radiating Sun Rays / Noor -->
  <g stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.3" stroke-linecap="round">
    <line x1="250" y1="145" x2="250" y2="160" />
    <line x1="230" y1="150" x2="222" y2="162" />
    <line x1="270" y1="150" x2="278" y2="162" />
    <line x1="215" y1="165" x2="202" y2="175" />
    <line x1="285" y1="165" x2="298" y2="175" />
  </g>

  <!-- Curving Calligraphy/Institution Text on Circular Path -->
  <path id="textCircleTop" d="M 75 250 A 175 175 0 0 1 425 250" fill="none" />
  <text font-family="'Cinzel', 'Playfair Display', serif" font-size="19" font-weight="bold" fill="url(#goldGrad)" letter-spacing="3.5">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      DAR UL ULOOM RIZVIA MASOOMIA
    </textPath>
  </text>

  <!-- Urdu Text / Subtitle on Bottom Circular Path -->
  <path id="textCircleBottom" d="M 420 260 A 175 175 0 0 1 80 260" fill="none" />
  <text font-family="'Amiri', 'Noto Nastaliq Urdu', serif" font-size="20" font-weight="bold" fill="#FCE79A" letter-spacing="1">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      دار العلوم رضویہ معصومیہ (برائے طالبات)
    </textPath>
  </text>

  <!-- Decorative Stars on left and right -->
  <g fill="url(#goldGrad)">
    <polygon points="70,250 72,254 77,255 73,258 74,263 70,260 66,263 67,258 63,255 68,254" />
    <polygon points="430,250 432,254 437,255 433,258 434,263 430,260 426,263 427,258 423,255 428,254" />
  </g>
</svg>
