<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 40" width="100%" height="40">
  <defs>
    <linearGradient id="dividerGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0" />
      <stop offset="25%" stop-color="#D4AF37" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FCE79A" stop-opacity="1" />
      <stop offset="75%" stop-color="#D4AF37" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- Main horizontal divider line -->
  <line x1="100" y1="20" x2="700" y2="20" stroke="url(#dividerGold)" stroke-width="1.5" />
  
  <!-- Central Emblem: 8-Pointed Star -->
  <g transform="translate(400, 20)" fill="#064E3B" stroke="#D4AF37" stroke-width="1.5">
    <rect x="-10" y="-10" width="20" height="20" rx="1" />
    <rect x="-10" y="-10" width="20" height="20" rx="1" transform="rotate(45)" />
    <circle cx="0" cy="0" r="4" fill="#D4AF37" />
  </g>

  <!-- Side Accent Diamonds -->
  <g fill="#D4AF37">
    <polygon points="360,20 365,16 370,20 365,24" />
    <polygon points="440,20 435,16 430,20 435,24" />
    <circle cx="340" cy="20" r="2" />
    <circle cx="460" cy="20" r="2" />
    <circle cx="320" cy="20" r="1.5" />
    <circle cx="480" cy="20" r="1.5" />
  </g>
</svg>